<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ちら見くん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ee; --panel:#ffffff; --ink:#2b2a27; --sub:#6d6a62; --line:#dcd7ca;
  --accent:#e0a526; --accent-ink:#3a2c05; --stage:#e9e5da; --code-bg:#fffdf8;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1b1a18; --panel:#26241f; --ink:#ece8dc; --sub:#a29d8f; --line:#3c3932;
    --accent:#e8b43a; --accent-ink:#2a1f03; --stage:#12110f; --code-bg:#201e1a;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"M PLUS Rounded 1c","BIZ UDGothic",system-ui,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
header.bar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line);
}
h1{font-size:17px; margin:0 6px 0 0; font-weight:700; white-space:nowrap}
.seg{display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden}
.seg button{
  border:0; background:transparent; color:var(--ink); font:inherit; font-size:13px;
  padding:6px 12px; cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); font-weight:700}
.btn{
  border:1px solid var(--line); background:transparent; color:var(--ink); font:inherit; font-size:13px;
  padding:6px 12px; border-radius:999px; cursor:pointer;
}
.btn:hover{border-color:var(--accent)}
.spacer{flex:1}
.info{font-size:12px; color:var(--sub)}
main{flex:1; min-height:0; display:grid; grid-template-columns:minmax(300px,38%) 1fr}
.pane{min-height:0; display:flex; flex-direction:column}
.editor{border-right:1px solid var(--line); background:var(--panel)}
.tabs{display:none}
textarea{
  font-family:"BIZ UDGothic",monospace; font-size:13px; line-height:1.55;
  color:var(--ink); background:var(--code-bg); border:0; outline:0; resize:none;
  padding:12px; width:100%; tab-size:2;
}
#code{flex:1; min-height:120px}
details{border-top:1px solid var(--line); background:var(--panel); max-height:48%; overflow:auto}
summary{padding:8px 12px; cursor:pointer; font-size:13px; color:var(--sub)}
.set{padding:0 12px 12px; display:grid; gap:8px}
.set label{font-size:12px; color:var(--sub); display:grid; gap:4px}
.set textarea,.set input,.set select{
  border:1px solid var(--line); border-radius:8px; background:var(--code-bg); color:var(--ink);
  font-family:"BIZ UDGothic",monospace; font-size:12px; padding:6px 8px; width:100%;
}
.set textarea{height:84px}
.set textarea.tall{height:130px}
.note{font-size:11.5px; color:var(--sub); line-height:1.5}
.stage{flex:1; min-height:0; background:var(--stage); overflow:auto; padding:8px; position:relative}
.holder{margin:0 auto; overflow:hidden; background:#fff; box-shadow:0 2px 14px rgba(0,0,0,.25); border-radius:6px}
iframe{border:0; display:block; background:#fff; width:100%}
.chick{position:absolute; right:14px; bottom:10px; font-size:24px; opacity:.9; pointer-events:none; transform-origin:50% 100%}
.chick.hop{animation:hop .6s ease}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}25%{transform:translateY(0) scale(1.15,.8)}55%{transform:translateY(-16px) scale(.95,1.1)}80%{transform:translateY(0) scale(1.1,.85)}100%{transform:translateY(0) scale(1,1)}}
.chick::after{content:attr(data-say); position:absolute; right:30px; bottom:6px; white-space:nowrap; font-size:11px; background:var(--panel); color:var(--sub); border:1px solid var(--line); border-radius:999px; padding:2px 9px; opacity:0; transition:opacity .25s}
.chick.hop::after{opacity:1}
@media (prefers-reduced-motion: reduce){.chick.hop{animation:none}}
@media (min-width:861px){
  body[data-hide="1"] main{grid-template-columns:1fr}
  body[data-hide="1"] .editor{display:none}
}
@media (max-width:860px){
  #hideEditor{display:none}
  main{grid-template-columns:1fr; grid-template-rows:auto 1fr}
  .tabs{display:flex; background:var(--panel); border-bottom:1px solid var(--line)}
  .tabs button{flex:1; border:0; background:transparent; color:var(--sub); font:inherit; font-size:14px; padding:9px; cursor:pointer; border-bottom:3px solid transparent}
  .tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent); font-weight:700}
  .editor{border-right:0}
  body[data-tab="code"] .previewpane{display:none}
  body[data-tab="view"] .editor{display:none}
  main{display:flex; flex-direction:column}
  .pane{flex:1}
}
</style>
</head>
<body data-tab="code">
<header class="bar">
  <h1>ちら見くん 🐣</h1>
  <div class="seg" id="widths" role="group" aria-label="表示幅">
    <button data-w="fluid" aria-pressed="true">PC</button>
    <button data-w="768" aria-pressed="false">タブレット</button>
    <button data-w="375" aria-pressed="false">スマホ</button>
  </div>
  <button class="btn" id="hideEditor" title="コード欄を隠して、プレビューを広く見る">コード欄を隠す</button>
  <button class="btn" id="reload" title="CSSをキャッシュなしで読み込み直す">CSS再読込</button>
  <span class="spacer"></span>
  <span class="info" id="info"></span>
</header>

<div class="tabs" id="tabs" role="tablist">
  <button role="tab" data-tab="code" aria-selected="true">コード</button>
  <button role="tab" data-tab="view" aria-selected="false">プレビュー</button>
</div>

<main>
  <section class="pane editor">
    <textarea id="code" spellcheck="false" placeholder="ここにHTMLを貼る（本文だけでも、ページ全体でもOK）"></textarea>
    <details id="settings">
      <summary>設定（CSSのURL・外枠）</summary>
      <div class="set">
        <label>サイトのURL（画像などの相対パスの基準）
          <input id="base" type="url" spellcheck="false">
        </label>
        <label>タイトル（外枠の {{TITLE}} に入る）
          <input id="title" spellcheck="false">
        </label>
        <label>読み込むCSS（1行に1つ）
          <textarea id="css" spellcheck="false"></textarea>
        </label>
        <label style="display:flex; align-items:center; gap:8px">
          <input type="checkbox" id="wpify" style="width:auto">
          <span>コードエディタのHTMLに、WordPressが表示時に足すclassを補う（&lt;!-- wp:... --&gt; があるときだけ働く）</span>
        </label>
        <label>追加CSS（サイトのhead内にあるインラインCSS。画像・段組みの見た目用）
          <textarea id="extra" spellcheck="false"></textarea>
        </label>
        <label>bodyのclass
          <input id="bodyclass" spellcheck="false">
        </label>
        <label>外枠のひな形
          <select id="preset"></select>
        </label>
        <label>外枠のHTML（{{CONTENT}} の位置に本文が入る）
          <textarea id="tpl" class="tall" spellcheck="false"></textarea>
        </label>
        <p class="note">お知らせ・活動報告の個別ページの外枠は、まだ実物を確認できていません。実際のページソースの &lt;main&gt; 付近を「自分で書く」に貼ると、より本物に近づきます。</p>
        <button class="btn" id="reset">設定を初期値に戻す</button>
      </div>
    </details>
  </section>

  <section class="pane previewpane">
    <div class="stage" id="stage">
      <div class="holder" id="holder"><iframe id="frame" title="プレビュー" sandbox="allow-popups allow-popups-to-escape-sandbox"></iframe></div>
      <div class="chick" id="chick" data-say="ぴよっ、更新したよ">🐣</div>
    </div>
  </section>
</main>

'<p>ここにHTMLを貼ると、サイトのCSSで表示されます。</p>\n' +
'<ul>\n  <li>項目その1</li>\n  <li>項目その2</li>\n</ul>\n' +
'<p><a href="#">リンクの見え方</a></p>';

  var DEFAULTS = {
    code: SAMPLE,
    base: SITE + "/",
    css: THEME + "/css/reset.css\n" + THEME + "/css/common.css\n" + SITE + "/wp-includes/blocks/paragraph/style.min.css",
    bodyclass: PRESETS.news.bodyclass,
    preset: "news",
    title: "サンプルのお知らせタイトル",
    extra: EXTRA_CSS,
    tpl: PRESETS.news.tpl,
    width: "fluid",
    hide: 0,
    wpify: 1
  };

  function $(id){ return document.getElementById(id); }
  var S = {};
  function load(){
    var saved = {};
    try { saved = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e){}
    for (var k in DEFAULTS) S[k] = (saved[k] !== undefined && saved[k] !== null) ? saved[k] : DEFAULTS[k];
    S.width = String(S.width);
    if (S.width !== "fluid" && S.width !== "768" && S.width !== "375") S.width = "fluid";
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  }

  var bust = "";
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

  var fullPage = false;
  function bodyOf(src){
    var m = /<body[^>]*>([\s\S]*)<\/body>/i.exec(src);
    return m ? m[1] : src;
  }
  // ブロックエディタ（コードエディタ）のHTMLに、WordPressが表示時に足すclassを補う
  var wpApplied = false;
  function addCls(attrs, cls){
    attrs = attrs || "";
    var m = /\sclass=("([^"]*)"|'([^']*)')/.exec(attrs);
    if (m) {
      var cur = m[2] !== undefined ? m[2] : m[3];
      var have = cur.split(/\s+/);
      var add = cls.filter(function(c){ return have.indexOf(c) < 0; });
      if (!add.length) return attrs;
      return attrs.replace(m[0], ' class="' + (cur + " " + add.join(" ")).trim() + '"');
    }
    return attrs + ' class="' + cls.join(" ") + '"';
  }
  function wpify(src){
    wpApplied = false;
    if (!/<!--\s*wp:/.test(src)) return src;
    var rules = [
      ["paragraph", "p", ["wp-block-paragraph"]],
      ["heading", "h[1-6]", ["wp-block-heading"]],
      ["list", "(?:ul|ol)", ["wp-block-list"]],
      ["columns", "div", ["is-layout-flex", "wp-block-columns-is-layout-flex"]],
      ["column", "div", ["is-layout-flow", "wp-block-column-is-layout-flow"]],
      ["group", "div", ["is-layout-flow", "wp-block-group-is-layout-flow"]]
    ];
    rules.forEach(function(r){
      var re = new RegExp("(<!--\\s*wp:" + r[0] + "(?![\\w-])(?:\\s+\\{[\\s\\S]*?\\})?\\s*-->\\s*)<(" + r[1] + ")((?:\\s[^>]*)?)>", "g");
      src = src.replace(re, function(m, c, tag, attrs){
        wpApplied = true;
        return c + "<" + tag + addCls(attrs, r[2]) + ">";
      });
    });
    return src;
  }
  function isFullPage(src){ return /<body[\s>]/i.test(src) || /<main[\s>]/i.test(src); }
  function bodyClassOf(src){
    var m = /<body[^>]*\sclass=["']([^"']*)["']/i.exec(src);
    return m ? m[1] : "";
  }

  function buildDoc(){
    var links = S.css.split(/\r?\n/).map(function(s){return s.trim();}).filter(Boolean).map(function(u){
      var url = bust ? u + (u.indexOf("?")>=0 ? "&" : "?") + "_=" + bust : u;
      return '<link rel="stylesheet" href="' + esc(url) + '">';
    }).join("\n");
    var content = bodyOf(S.code);
    wpApplied = false;
    if (S.wpify && !isFullPage(S.code)) content = wpify(content);
    var tpl = S.tpl.indexOf("{{CONTENT}}") >= 0 ? S.tpl : S.tpl + "\n{{CONTENT}}";
    var ttl = String(S.title || "").replace(/&/g,"&amp;").replace(/</g,"&lt;");
    var inner = tpl.split("{{TITLE}}").join(ttl).split("{{CONTENT}}").join(content);
    var bcls = S.bodyclass;
    fullPage = isFullPage(S.code);
    if (fullPage) { inner = content; bcls = bodyClassOf(S.code) || S.bodyclass; }
    var base = S.base ? '<base href="' + esc(S.base) + '" target="_blank">' : "";
    return '<!doctype html><html lang="ja"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width">' + base + links +
      (S.extra ? '<style>' + String(S.extra).replace(/<\/style/gi, "") + '</style>' : "") +
      '</head><body class="' + esc(bcls) + '">' + inner + '</body></html>';
  }

  var frame = $("frame"), holder = $("holder"), stage = $("stage");
  var timer = null;
  var says = ["ぴよっ、更新したよ","できたてだよ","いい感じ？","ちら見ちら見","おっ、変わったね","ぴよぴよ"];
  var chick = $("chick"), chickTimer = null;
  function hop(){
    chick.setAttribute("data-say", says[Math.floor(Math.random()*says.length)]);
    chick.classList.remove("hop"); void chick.offsetWidth; chick.classList.add("hop");
    clearTimeout(chickTimer); chickTimer = setTimeout(function(){ chick.classList.remove("hop"); }, 1600);
  }
  var firstRender = true;
  function render(){
    frame.srcdoc = buildDoc();
    updateInfo();
    if (firstRender) { firstRender = false; } else { hop(); }
  }
  function renderSoon(){
    clearTimeout(timer);
    timer = setTimeout(render, 250);
  }

  function updateInfo(){
    var w = Math.round(holder.getBoundingClientRect().width);
    $("info").textContent = "幅 " + w + "px ・ 100%" + (fullPage ? " ・ ページ全体として表示中（外枠は使っていません）" : "") + (wpApplied ? " ・ ブロックのclassを補って表示中" : "");
  }
  function fit(){
    if (!stage.clientWidth || !stage.clientHeight) return; // 非表示のタブでは計算しない
    var availW = Math.max(100, stage.clientWidth - 16);
    var availH = Math.max(100, stage.clientHeight - 16);
    var fluid = (S.width === "fluid");
    holder.style.width = fluid ? availW + "px" : (Number(S.width) || 375) + "px";
    holder.style.height = availH + "px";
    frame.style.height = availH + "px";
    updateInfo();
  }

  function setWidth(w){
    S.width = String(w); save();
    Array.prototype.forEach.call($("widths").querySelectorAll("button"), function(b){
      b.setAttribute("aria-pressed", String(b.dataset.w === S.width));
    });
    fit();
  }

  function applyToFields(){
    $("code").value = S.code;
    $("base").value = S.base;
    $("css").value = S.css;
    $("bodyclass").value = S.bodyclass;
    $("title").value = S.title;
    $("extra").value = S.extra;
    $("wpify").checked = !!S.wpify;
    $("preset").value = S.preset;
    $("tpl").value = S.tpl;
  }

  function init(){
    load();
    var sel = $("preset");
    Object.keys(PRESETS).forEach(function(k){ var o=document.createElement("option"); o.value=k; o.textContent=PRESETS[k].label; sel.appendChild(o); });
    var oc=document.createElement("option"); oc.value="custom"; oc.textContent="自分で書く"; sel.appendChild(oc);
    applyToFields();
    setWidth(S.width);

    $("code").addEventListener("input", function(){ S.code = this.value; save(); renderSoon(); });
    $("base").addEventListener("input", function(){ S.base = this.value.trim(); save(); renderSoon(); });
    $("css").addEventListener("input", function(){ S.css = this.value; save(); renderSoon(); });
    $("wpify").addEventListener("change", function(){ S.wpify = this.checked ? 1 : 0; save(); render(); });
    $("extra").addEventListener("input", function(){ S.extra = this.value; save(); renderSoon(); });
    $("title").addEventListener("input", function(){ S.title = this.value; save(); renderSoon(); });
    $("bodyclass").addEventListener("input", function(){ S.bodyclass = this.value; save(); renderSoon(); });
    $("tpl").addEventListener("input", function(){
      S.tpl = this.value; S.preset = "custom"; $("preset").value = "custom"; save(); renderSoon();
    });
    $("preset").addEventListener("change", function(){
      S.preset = this.value;
      if (PRESETS[this.value]) {
        S.tpl = PRESETS[this.value].tpl; S.bodyclass = PRESETS[this.value].bodyclass;
        $("tpl").value = S.tpl; $("bodyclass").value = S.bodyclass;
      }
      save(); render();
    });

    $("widths").addEventListener("click", function(e){
      var b = e.target.closest("button"); if (!b) return;
      setWidth(b.dataset.w);
      document.body.dataset.tab = "view"; syncTabs(); fit();
    });
    function applyHide(){
      document.body.dataset.hide = S.hide ? "1" : "0";
      $("hideEditor").textContent = S.hide ? "コード欄を出す" : "コード欄を隠す";
      requestAnimationFrame(fit);
    }
    $("hideEditor").addEventListener("click", function(){ S.hide = S.hide ? 0 : 1; save(); applyHide(); });
    applyHide();
    $("reload").addEventListener("click", function(){ bust = String(Date.now()); render(); });
    $("reset").addEventListener("click", function(){
      if (!confirm("設定を初期値に戻します（貼ったHTMLはそのまま残ります）。よろしいですか？")) return;
      var keep = S.code;
      for (var k in DEFAULTS) S[k] = DEFAULTS[k];
      S.code = keep; save(); applyToFields(); setWidth(S.width); render();
    });

    function syncTabs(){
      Array.prototype.forEach.call($("tabs").querySelectorAll("button"), function(b){
        b.setAttribute("aria-selected", String(b.dataset.tab === document.body.dataset.tab));
      });
    }
    $("tabs").addEventListener("click", function(e){
      var b = e.target.closest("button"); if (!b) return;
      document.body.dataset.tab = b.dataset.tab; syncTabs();
      requestAnimationFrame(fit);
    });

    if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
    window.addEventListener("resize", fit);
    render();
  }
  init();
  window.__chiramikun = { buildDoc: buildDoc, state: S };
})();
</script>
</body>
</html>
